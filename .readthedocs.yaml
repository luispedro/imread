# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# imread itself is not installed, as building it needs the C image libraries.
# conf.py reads the version from the source tree, and autodoc imports the
# Python code from there, with the compiled extension and NumPy mocked.
python:
   install:
   - requirements: readthedocs-requirements.txt
